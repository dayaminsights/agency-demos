<script>window.__LEAD__ = {"lead_id": "0f4dff55-76c6-4a3d-ba83-a3fcc106340e", "business_name": "Oral Hygienist Leanne Simpson", "category": "medical_dental", "location": "Peter Place, Hurlingham, Sandton, 2191, South Africa", "copywriting": {"hero_headline": "Sandton's Oral Hygienist Who Makes You Actually Look Forward to Your Appointment", "hero_subheadline": "Book your next appointment with Leanne Simpson, Hurlingham's trusted oral hygienist — backed by 41 five-star reviews.", "problem_text": "You know you're overdue for a clean, but finding a hygienist in Sandton you can actually trust — someone gentle, thorough, and worth your time — feels harder than it should be.", "about_text": "I'm Leanne Simpson, an independent oral hygienist based in Hurlingham, Sandton. Every appointment I run starts with a proper conversation — because knowing what's going on in your mouth before I touch it is how I avoid surprises and keep you comfortable. I take my time with each patient, I explain what I'm doing and why, and I don't rush. That's not a philosophy, that's just how I work.", "services_intro": "From routine scaling and polishing to professional whitening, here's what I offer at my Hurlingham, Sandton practice.", "cta_text": "Book your appointment online — quick and easy.", "testimonials_intro": "5.0★ from 41 patients who keep coming back."}, "design_system": {"palette": ["#1a2a2a", "#c0392b", "#f0ece6", "#faf9f7", "#2c2c2a"], "fonts": {"heading": "Cormorant Garamond", "body": "Inter"}, "vibe": "Warm clinical — the precision and cleanliness of a modern dental practice, grounded in the rich, earthy tones of a trusted sole practitioner. Deep burgundy authority balanced against parchment-light backgrounds and soft warm neutrals. Quietly confident, never cold."}, "sections": {"services": [{"title": "Scaling & Polishing", "desc": "A thorough professional clean that removes built-up tartar and leaves your gums healthier than a toothbrush alone ever could."}, {"title": "Teeth Whi
