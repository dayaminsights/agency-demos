<script>window.__LEAD__ = {"lead_id": "0f4dff55-76c6-4a3d-ba83-a3fcc106340e", "business_name": "Oral Hygienist Leanne Simpson", "category": "medical_dental", "location": "Peter Place, Hurlingham, Sandton, 2191, South Africa", "copywriting": {"hero_headline": "Clean Teeth, Healthy Gums — Right Here in Hurlingham", "hero_subheadline": "Book your cleaning appointment online in under 2 minutes — whitening consultations available on request.", "problem_text": "You put off the dentist because you dread the discomfort, the judgment, and the cold clinical atmosphere — and your gums are paying the price.", "about_text": "I'm Leanne Simpson, oral hygienist at Peter Place, Hurlingham. I've been treating patients from childhood through adulthood for decades — not because I chase new patients, but because I take the time to explain what I'm doing, why it matters, and how to keep your results between visits. Every appointment runs at your pace, and I don't move on until you're comfortable.", "services_intro": "From your first scale-and-polish to professional whitening, here's what we treat at the Hurlingham practice.", "cta_text": "Book your appointment — takes under 2 minutes", "testimonials_intro": "5.0★ across 41 reviews — here's what patients say."}, "design_system": {"palette": ["#1e2b2c", "#0fa37f", "#f0f5f4", "#fafcfb", "#1a2a2b"], "fonts": {"heading": "Cormorant Garamond", "body": "Inter"}, "vibe": "Warm clinical — the authority of a healthcare practice softened by earthy, parchment tones and deep teal-and-burgundy anchors. Clean layouts with generous white space, precise typographic hierarchy, and subtle warm taupe accents drawn directly from the practice environment. Feels trustworthy without feeling cold."}, "sections": {"services": [{"title": "Scale & Polish", "desc": "Thorough plaque and tartar removal that leaves your gums clean, tight, and healthy."}, {"title": "Professional Teeth Whitening", "desc": "In-chair whitening with results you'll see the same day — no trays, no waiting."}, {"title": "Gum Disease Assessment & Treatment", "desc": "Early detection and targeted treatment to stop gum disease before it becomes irreversible."}, {"title": "Oral Hygiene Instruction", "desc": "Personalised brushing and flossing guidance so your results last between appointments."}, {"title": "Dental X-Rays", "desc": "Diagnostic imaging to catch what the naked eye misses — decay, bone loss, and hidden pathology."}, {"title": "New Patient Consultation", "desc": "A full assessment of your teeth, gums, and oral health history so we build the right plan for you."}], "faqs": [{"q": "How do I book an appointment?", "a": "You can book directly through the online booking form on this website — it takes under 2 minutes. If you prefer, you're welcome to call the practice during office hours and we'll get you scheduled."}, {"q": "Where exactly is the practice located?", "a": "We're based at Peter Place, Hurlingham, Sandton, 2191. There is parking available on-site, and the practice is easily accessible from the surrounding Sandton suburbs."}, {"q": "Does the practice accept medical aid?", "a": "Yes, we accept most major South African medical aid schemes. Please contact us before your appointment to confirm that your specific plan is covered, so there are no surprises at checkout."}, {"q": "Is teeth whitening suitable for everyone?", "a": "Not always — whitening isn't recommended for patients with certain restorations, sensitivity conditions, or active gum disease. Leanne will assess your suitability during a short consultation before any whitening treatment begins."}, {"q": "How often should I see an oral hygienist?", "a": "Most patients benefit from a professional clean every six months, though some — particularly those managing gum disease or high plaque buildup — may need quarterly visits. Leanne will recommend a recall interval based on your specific oral health at your first appointment."}]}, "media": {"hero": [], "gallery": ["images/img-002.jpg", "  A+! Every time. Warm, gentle, and genuinely lovely...You walk out looking forward to your next visit.", "rating": 5, "time": 1749395307}, {"author": "Michael Parker", "text": "If you want super clean teeth pay a visit to Leanne you will not be disappointed", "rating": 5, "time": 1771530161}], "rating": 5.0, "user_ratings_total": 41, "phone": "011 706 1396", "phone_href": "tel:0117061396", "geo": {"lat": -26.0794066, "lng": 28.0125595}, "address": "Peter Place, Hurlingham, Sandton, 2191, South Africa"};</script>
