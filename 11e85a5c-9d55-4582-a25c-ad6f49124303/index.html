<script>window.__LEAD__ = {"lead_id": "11e85a5c-9d55-4582-a25c-ad6f49124303", "business_name": "Peter Cat", "category": "restaurant", "location": "Stephen Court Building, 18 A, Park St, opposite KFC Restaurant, Park Street area, Kolkata, West Bengal 700071, India", "copywriting": {"hero_headline": "The Chelo Kebab That Started Every Conversation About Park Street.", "hero_subheadline": "Skip the queue. Reserve your table online in under 60 seconds.", "problem_text": "You've driven to Park Street, waited 45 minutes on the footpath, and still gone home without a table — because there was no way to book one in advance.", "about_text": "Peter Cat has occupied the same corner of Stephen Court since the era when Park Street defined Calcutta's dining culture. The Chelo Kebab — saffron-tinted rice, a fried egg, a pat of butter, and kebabs plated tableside — has not changed because it does not need to. We are not interested in reinvention. We are interested in getting your order right, the same way we always have.", "services_intro": "From the Persian-inspired Chelo Kebab to sizzling continental platters and the brownie that closes every great meal here, the full menu is below.", "cta_text": "Reserve Your Table — No Queue, No Callback.", "testimonials_intro": "4.2★ from over 40,000 guests who made the trip to Park Street and came back for more."}, "design_system": {"palette": ["#150804", "#a40c01", "#513426", "#1c1b1c", "#646464", "#f2ede8"], "fonts": {"heading": "Playfair Display", "body": "EB Garamond"}, "vibe": "Theatrical old-world supper club. Deep near-black backgrounds anchored by #150804, with #a40c01 used sparingly for active elements and critical CTAs only. Warm off-white #f2ede8 replaces pure white for all body text and surface copy to hold warmth against dark panels. #513426 functions as a mid-tone separator for ruled lines, card borders, and section dividers. Typography is unhurried and editorial — Playfair Display headlines carry the institutional weight, EB Garamond body text reads like a handwritten menu card. No gradients. No drop shadows. Let the photography and the negative space do the atmospheric work."}, "sections": {"menu": [{"name": "Chelo Kebab", "desc": "Saffron rice, fried egg, butter, and choice of kebab — the dish Park Street is measured against.", "price": "₹820"}, {"name": "Bekti Meunier", "desc": "River bekti pan-finished in a classic butter-lemon sauce with golden-fried potatoes.", "price": "₹780"}, {"name": "Mutton Dum Ki Rani", "desc": "Slow-braised mutton in aromatic whole spices, served with fresh masala kulcha.", "price": "₹720"}, {"name": "Grilled Chicken Sizzler", "desc": "Chargrilled chicken breast on a cast-iron platter, arriving at your table still smoking.", "price": "₹690"}, {"name": "Sheekh Kebab", "desc": "Spiced minced meat rolled on skewers and finished over charcoal — order it inside the Chelo.", "price": "₹480"}, {"name": "Brownie with Vanilla Ice Cream", "desc": "Warm soft brownie, cold vanilla scoop, hot chocolate sauce poured at the table.", "price": "₹320"}, {"name": "Hot Chocolate", "desc": "Properly dark, properly thick — the one drink that ends every meal here.", "price": "₹220"}, {"name": "Masala Kulcha", "desc": "Soft, freshly baked flatbread spiced just enough to hold its own against the slow-cooked gravies.", "price": "₹180"}], "usps": ["Iconic Since Opening", "No Queue Required", "Persian Chelo Heritage", "Same Corner, Park Street", "Sizzlers Done Right", "Reserve in 60 Seconds"]}, "media": {"hero": ["11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-001.jpg"], "gallery": ["11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-003.jpg", "11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-004.jpg", "11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-005.jpg", "11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-006.jpg", "11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-007.jpg", "11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-008.jpg", "11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-009.jpg", "11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-010.jpg"], "about": ["11e85a5c-9d55-4582-a25c-ad6f49124303/images/img-002.jpg"]}, "reviews": [{"author": "Diptiman Das", "text": "It was my first visit to Peter cat with one of my friend. Heard so so much but never had the chance to visit here.\nPeter cat do not need any introduction, so without further ado I will just share my experience\n\n1. Beckti Meunier: O My God!!!!! This dish was absolutely out of the park. The fish was  literally melting in the mouth and the taste was fantastic. The creamy texture plus the taste blew my head. The potatoes were also nicely cooked with perfect amount of spices. (10/10)\n\n2. Chelo Kebab: Now when you visit here, you need to have this right??? So definitely we ordered chelo Kebab and it definitely did not disappointed me. Everyone knows about this dish and do not require any further explanation, but do need some improvement according to me: the amount of rice is too less and according to many reviews, the quantity gradually decreased over the years. Moreover, personally, I found the sheekh kabab to be dry and not that tasty. I had much better ones elsewhere. Overall, it was a great dish. (8/10)\n\n3. Vanilla ice-cream with warm brownie and hot chocolate sauce: Great great combination. Not too sweet, just the perfect balance. The brownie was soft and paired beautifully with the hot chocolate sauce and the ice-cream. (10/10)\n\n4. Hot chocolate: A good drink with proper chocolatey flavour and balanced sweetness. (10/10)\n\nOverall, a great great experience. Will definitely try out the famous sizzlers over here next time.", "rating": 5, "time": 1778955751}, {"author": "aveek seal", "text": "The one thing this restaurant brings to our mind is the age old famous Chelo Kebab. You can experience the original taste of the famous Chelo Kebab here. The restaurant is very good place to visit with your family. The ambience is well decorated and the staffs are really very good. All food items offered by the restaurant are good. And don't forget to try their dessert items", "rating": 5, "time": 1770520279}, {"author": "Rahul Chakraborty", "text": "We started with the Mutton Dum Ki Rani, which was exceptionally flavorful—rich, aromatic, and cooked to perfection. The Masala Kulcha complemented it beautifully, being soft, fresh, and perfectly balanced in taste. This combination was easily one of the highlights of the meal.\n\nThe Chelo Kebab truly stood out as one of their authentic signature dishes. The kebabs were juicy, perfectly seasoned, and packed with flavor, reflecting the restaurant’s legacy and expertise. A must-try for anyone visiting Peter Cat.\n\nThe Grilled Chicken with sauce (sizzler) was well-prepared and tasted good overall. It was served on a sizzling platter with an appealing presentation, adding a premium and visually impressive touch.\n\nFor dessert, we chose the Brownie with Vanilla Ice Cream and Hot Chocolate. The flavors were rich and indulgent; however, the brownie felt slightly overcooked at the bottom and had become a bit hard. Aside from this minor detail, the dessert was enjoyable.\n\nThe ambience is classic and elegant, with a timeless, old-world charm that truly defines the place. The warm lighting, comfortable seating, and calm atmosphere create a refined and pleasant dining environment.\n\nOverall, an impressive experience with high-quality food, excellent presentation, and a sophisticated ambience. Highly recommended.", "rating": 5, "time": 1765992389}, {"author": "Teerna Sinha", "text": "*Peter Cat – Chelo Kebab Review*\n\n*The hype*: Totally justified. Peter Cat’s Chelo Kebab has been a Park Street icon since 1975, and it still pulls crowds for a reason.\n\n*What you get on the plate*:\n- *Mutton sheekh kebab*: Soft, juicy, and smoky. The spice is subtle so the meat shines. It really does melt in your mouth.\n- *Fried egg*: Served right on top of the kebab. Runny yolk mixes into the rice and makes it richer.\n- *Butter rice*: Fragrant yellow pulao loaded with butter. That’s the “Chelo” part, and it’s the star.\n- *Grilled sides*: A charred tomato and a buttery potato wedge on the side to cut the richness.\n\n*The vibe*: Old-school Kolkata. Wood panels, dim lights, waiters in uniform. The sizzler plate arrives with that sound and buttery aroma that hits before the food does.\n\n*Price*: ₹505 for chicken platter. Portion is perfect for one hungry person. Two people sharing might feel it’s a bit less.\n\n*Verdict*: 8.5/10. Go for the nostalgia and the experience as much as the food. It’s not just a dish, it’s a Park Street ritual.\n\n*Pro tip*: Eat it piping hot. Break the egg and mix that yolk into the rice with the kebab. That’s how you get the full flavor.", "rating": 5, "time": 1780385256}, {"author": "Sarbojit Bhattacharya", "text": "Peter Cat is located in Park Street, opposite KFC. This restaurant started their journey in 1975. One of the finest restaurant in Kolkata. I went to several times for lunch. Last I went on 10th May 26 in the occasion of Mother's Day. Let's come to the points one by one.\nAtmosphere - You will get royal atmosphere over here. Lots of foreigners also come to have food. If you will go in weekend or any holiday, expect that you need to wait minimum for 30 minutes.\nService - Service is also very good.\nFood - Now let6xome to the food, they offer almost all kind of food like continental, north indian, chinese. But they are famous for the 'Chello Kebab'. You will find both sizzler and non sizzler 'Chello Kebab'. A must try dish. All the food are superb quality and also budget friendly.\nA must visit restaurant.", "rating": 5, "time": 1778847324}], "rating": 4.2, "user_ratings_total": 40201, "phone": "033 2229 8841", "phone_href": "tel:03322298841", "geo": {"lat": 22.5524437, "lng": 88.3525942}, "address": "Stephen Court Building, 18 A, Park St, opposite KFC Restaurant, Park Street area, Kolkata, West Bengal 700071, India"};</script>
