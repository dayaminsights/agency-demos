-grilled, marinated in-house, consistently the dish every table orders twice.", "price": "AED 120"}, {"name": "Arayes", "desc": "Grilled flatbread stuffed with spiced minced meat — crisp outside, juicy through.", "price": "AED 28"}, {"name": "Kafta Platter", "desc": "Seasoned ground lamb skewers grilled over charcoal, served with fresh bread and dips.", "price": "AED 42"}, {"name": "Mixed Grill for Two", "desc": "A full spread — lamb chops, kafta, shish tawook, and grilled vegetables on one platter.", "price": "AED 145"}, {"name": "Shish Tawook", "desc": "Marinated chicken cubes, grilled tender with a char on every edge.", "price": "AED 38"}, {"name": "Hummus with Meat", "desc": "Warm, hand-finished hummus topped with spiced minced lamb and toasted pine nuts.", "price": "AED 32"}, {"name": "Fattoush", "desc": "Fresh chopped vegetables, sumac dressing, and house-fried bread croutons.", "price": "AED 22"}, {"name": "Grilled Halloumi", "desc": "Thick-cut halloumi, marked on the grill, served with mint and a wedge of lemon.", "price": "AED 30"}], "usps": ["Charcoal-Grilled Daily", "In-House Marinade", "Locals Eat Here", "Queue Means Quality", "Generous Portions", "Indoor & Outdoor Seating"]}, "media": {"hero": [], "gallery": [], "about": []}, "reviews": [{"author": "Journeys & Stories", "text": "I visited this restaurant yesterday at lunch and was surprised to see it completely packed. Once we found a table, the waiter quickly brought our starters. We ordered kafta, lamb chops, and arayes, and everything arrived in less than 10 minutes.\n\nWhile it’s not the best Lebanese food I’ve ever had, the combination of reasonable prices and fast, friendly service makes it worth a visit.\n\nFirst-timers should grab any available seat quickly, as this place is busy almost all the time!", "rating": 4, "time": 1774203675}, {"author": "Naveed Ahmed", "text": "Al Sultan Restaurant in Abu Dhabi is always worth the visit. Their grill is outstanding—perfectly seasoned, smoky, and consistently tender. The lamb chops are especially impressive, full of rich flavor, and the arayees are crisp on the outside with a juicy, well‑spiced filling.\n\nThere’s almost always a queue, which says a lot about how popular the place is, but the wait is usually worth it. They offer both indoor and outdoor seating, making it easy to enjoy the meal the way you prefer. A great spot for anyone craving authentic Arabic grilling and generous portions.", "rating": 4, "time": 1771481443}, {"author": "Kave Lights", "text": "Absolutely have to come here to eat if you’re in Abu Dhabi. This location specifically. Came here for 3 meals during my 8 day stay in the UAE. Lamb chops are a must, probably one of the best I’ve ever tasted, if not the best! Order a kilo of it! The locals all eat here also, that speaks volumes. Definitely one of the most satisfying , and best bang for your buck meals. If you love meat, then look no further.", "rating": 5, "time": 1771998008}, {"author": "Mohsin Karbelkar", "text": "We ordered a variety of mixed grills. It came with so many extras, humus, salads etc. The waiter was friendly and the service was efficient. The food was very tasty and they bake their own flat bread which was served hot out of the oven.", "rating": 5, "time": 1767433560}, {"author": "joe abu", "text": "One of the best local grilled kabab restaurants in Abu Dhabi that serves fresh quality ingredients at a reasonable prices. Highly recommended for take out or delivery.", "rating": 5, "time": 1768559481}], "rating": 4.3, "user_ratings_total": 3401, "phone": "02 641 2511", "phone_href": "tel:026412511", "geo": {"lat": 24.4751627, "lng": 54.3769944}, "address": "22 شارع مُيُول - Al Danah - E18 02 - Abu Dhabi - United Arab Emirates"};</script>
